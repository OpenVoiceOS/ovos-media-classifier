[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-classifier"
dynamic = ["version"]
description = "Pluggable media-type classification for OCP (Open Conversation Platform)."
readme = "README.md"
authors = [
    { name = "JarbasAI", email = "jarbasai@mailfence.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.0.38",
    "mediavocab>=1.3.0a2,<2.0.0",
    # OVOS-INTENT-2 .voc loader + word-boundary matcher for the bundled locale
    "ovos-spec-tools>=0.6.0a1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime",
    "numpy",
]
# --- optional NER (entity-based) backend (Aho-Corasick over the user's real entities) ---
ner = [
    "ahocorasick-ner>=0.0.1",
]
media_servers = [
    "requests",
]
# --- Layer B online metadatarr backend (network, opt-in, OFF by default) ---
# Adds the metadatarr metadata-resolution layer the online classifier calls to
# resolve a bare title's canonical media_type. Latency-aware: enable only via
# ``media_classifier_online_metadatarr: true``.
online = [
    "metadatarr>=0.5.0a1",
]
huggingface = [
    "datasets",
]

# --- training-only deps (NOT needed at runtime) ---
# Train the ONNX bundle (``training/train_sklearn.py``) and rebuild the dataset
# (``training/build_dataset.py``).  The runtime backend stays on
# ``onnxruntime`` + ``numpy`` (the ``onnx`` extra); this extra only adds the
# offline scikit-learn → ONNX toolchain.
train = [
    "scikit-learn",
    "skl2onnx",
    "onnx",
    "onnxruntime",
    "numpy",
    "pandas",
    # neural (PyTorch → ONNX) training path (training/train_torch.py) + the
    # domain word-vector corpus (training/build_corpus.py).  Inference stays on
    # onnxruntime + numpy only — torch/gensim are TRAIN-ONLY, never imported at
    # runtime (the exported bundle is a plain ONNX graph + a saved .npy matrix).
    "torch",
    "gensim",
]

# test deps — the online metadatarr backend is patched (never hits the network)
# but must be importable for the patch target to exist
test = [
    "pytest",
    "pytest-cov",
    "metadatarr>=0.5.0a1",
    # test_embedding.py / test_gazetteer.py build the embedding-router axis
    # heads by hand with plain numpy arrays (no onnxruntime, no model file) —
    # numpy alone is enough for these to collect and run.
    "numpy",
]

# NOTE: dataset-build/training tooling lives in the top-level ``training/`` dir
# (NOT shipped in the wheel); run it from a checkout. See training/README.md.

# Self-registration under the plugin group this repo defines: the keyword
# backend is the reference opm.media.classifier plugin, so OPM discovery and
# the external-plugin path are exercised by the package itself.
[project.entry-points."opm.media.classifier"]
ovos-media-classifier-keyword = "ovos_media_classifier.keyword:KeywordMediaClassifier"

[tool.setuptools.dynamic]
version = { attr = "ovos_media_classifier.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_media_classifier*"]

# ship the bundled locale resources: the .voc keyword + lead-in files (the no-arg
# KeywordMediaClassifier reads ovos_media_classifier/locale/<lang>/<Vocab>.voc
# directly off disk) and the translatable dataset .intent templates under
# locale/<lang>/dataset/ (so ovos-localize and build_dataset see them in the
# installed package) + the PEP 561 typing marker for downstream type-checkers.
[tool.setuptools.package-data]
ovos_media_classifier = [
    "locale/*/*.voc",
    "locale/*/dataset/*.intent",
    "data/gazetteer.json",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.coverage.run]
source = ["ovos_media_classifier"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
