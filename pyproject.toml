[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-classifier"
dynamic = ["version"]
description = "Pluggable media-type classification for OCP (Open Conversation Platform)."
readme = "README.md"
authors = [
    { name = "JarbasAI", email = "jarbasai@mailfence.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.0.38",
    "mediavocab>=1.0.0,<2.0.0",
    # OVOS-INTENT-2 .voc loader + word-boundary matcher for the bundled locale
    "ovos-spec-tools>=0.6.0a1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime",
    "numpy",
]
# --- optional NER (entity-based) backend (Aho-Corasick over the user's real entities) ---
ner = [
    "ahocorasick-ner>=0.0.1",
]
media_servers = [
    "requests",
]
huggingface = [
    "datasets",
]

# --- training-only deps (NOT needed at runtime) ---
# Train the ONNX bundle (``training/train_sklearn.py``) and rebuild the dataset
# (``training/build_dataset.py``).  The runtime backend stays on
# ``onnxruntime`` + ``numpy`` (the ``onnx`` extra); this extra only adds the
# offline scikit-learn → ONNX toolchain.
train = [
    "scikit-learn",
    "skl2onnx",
    "onnx",
    "onnxruntime",
    "numpy",
    "pandas",
]

# test deps — optional-backend deps are mocked in the suite, so [test] runs green
test = [
    "pytest",
    "pytest-cov",
]

# NOTE: dataset-build/training tooling lives in the top-level ``training/`` dir
# (NOT shipped in the wheel); run it from a checkout. See training/README.md.

[tool.setuptools.dynamic]
version = { attr = "ovos_media_classifier.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_media_classifier*"]

# ship the bundled locale resources: the .voc keyword + lead-in files (the no-arg
# KeywordMediaClassifier reads ovos_media_classifier/locale/<lang>/<Vocab>.voc
# directly off disk) and the translatable dataset .intent templates under
# locale/<lang>/dataset/ (so ovos-localize and build_dataset see them in the
# installed package) + the PEP 561 typing marker for downstream type-checkers.
[tool.setuptools.package-data]
ovos_media_classifier = [
    "locale/*/*.voc",
    "locale/*/dataset/*.intent",
    "py.typed",
]
