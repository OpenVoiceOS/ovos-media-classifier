[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-classifier"
dynamic = ["version"]
description = "Pluggable media-type classification for OCP (Open Conversation Platform)."
readme = "README.md"
authors = [
    { name = "JarbasAI", email = "jarbasai@mailfence.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.0.38",
    "mediavocab>=1.0.0,<2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# --- optional NER (entity-based) backend ---
# AhocorasickMediaClassifier matches utterances against the user's real
# entities (movie titles, artist names, …) via an Aho-Corasick automaton.
ner = [
    "ahocorasick-ner>=0.0.1",
]
# media-server loaders (Radarr / Sonarr / Lidarr / Jellyfin / Music Assistant)
media_servers = [
    "requests",
]
# HuggingFace datasets loader for EntitiesContainer.load_huggingface()
huggingface = [
    "datasets",
]

# test deps — the NER backend deps are mocked in the suite, so the bare
# [test] extra still runs green without ahocorasick-ner / requests / datasets.
test = [
    "pytest",
    "pytest-cov",
]

# NOTE: dataset-build/training tooling lives in the top-level ``training/`` dir
# (NOT shipped in the wheel); run it from a checkout. See training/README.md.

[tool.setuptools.dynamic]
version = { attr = "ovos_media_classifier.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_media_classifier*"]

# ship the bundled .voc keyword files (the no-arg KeywordMediaClassifier reads
# ovos_media_classifier/locale/<lang>/<Vocab>.voc directly off disk)
[tool.setuptools.package-data]
ovos_media_classifier = ["locale/*/*.voc"]
